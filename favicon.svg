  <!-- Root system - offwhite, organic branching shapes below ground -->
  <path d="M16 22 Q14 24 11 25 Q9 25.5 7 25" stroke="#d4cfc4" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M11 25 Q10 26.5 8 28" stroke="#d4cfc4" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M16 22 Q18 24 21 25 Q23 25.5 25 25" stroke="#d4cfc4" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M21 25 Q22 26.5 24 28" stroke="#d4cfc4" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M16 22 Q15 25 13 27" stroke="#d4cfc4" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.45"/>
  <path d="M16 22 Q17 25 19 27" stroke="#d4cfc4" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.45"/>
