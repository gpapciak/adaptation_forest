  <path d="M7 25 Q6 26 5 26.5" stroke="#d4cfc4" stroke-width="0.4" fill="none" stroke-linecap="round" opacity="0.3"/>
  <path d="M25 25 Q26 26 27 26.5" stroke="#d4cfc4" stroke-width="0.4" fill="none" stroke-linecap="round" opacity="0.3"/>
  <path d="M13 27 Q12 28.5 11 29" stroke="#d4cfc4" stroke-width="0.4" fill="none" stroke-linecap="round" opacity="0.25"/>
  <path d="M19 27 Q20 28.5 21 29" stroke="#d4cfc4" stroke-width="0.4" fill="none" stroke-linecap="round" opacity="0.25"/>
  
  <!-- Trunk - birch white, shifted higher -->
  <line x1="16" y1="22" x2="16" y2="9" stroke="#e8e4dc" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Canopy - shifted higher, brighter greens -->
  <circle cx="16" cy="6" r="5.5" fill="#4a8a4a" opacity="0.95"/>
  <circle cx="11.5" cy="8.5" r="4" fill="#3d7a3d" opacity="0.85"/>
  <circle cx="20.5" cy="8.5" r="4" fill="#3d7a3d" opacity="0.85"/>
  <circle cx="13.5" cy="3.5" r="3.5" fill="#5a9a5a" opacity="0.8"/>
