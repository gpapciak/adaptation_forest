  <circle cx="16" cy="2" r="2.5" fill="#6aaa6a" opacity="0.6"/>
  
  <!-- Light edges on canopy -->
  <circle cx="16" cy="6" r="5.5" fill="none" stroke="#7aba7a" stroke-width="0.4" opacity="0.5"/>
  <circle cx="11.5" cy="8.5" r="4" fill="none" stroke="#7aba7a" stroke-width="0.3" opacity="0.4"/>
  <circle cx="20.5" cy="8.5" r="4" fill="none" stroke="#7aba7a" stroke-width="0.3" opacity="0.4"/>
  
  <!-- Amber light point in canopy -->
  <circle cx="16" cy="6" r="1.5" fill="#c4883a"/>
  <circle cx="16" cy="6" r="2.5" fill="#c4883a" opacity="0.3"/>
