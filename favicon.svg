<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="#0a0a08"/>
  
  <!-- Stylized tree - geometric, inspired by the site's line-art aesthetic -->
  <!-- Trunk -->
  <line x1="16" y1="28" x2="16" y2="14" stroke="#c4883a" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Root system spreading underground - mycelial/interconnected feel -->
  <path d="M16 28 Q12 30 8 29" stroke="#2d4a2d" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <path d="M16 28 Q20 30 24 29" stroke="#2d4a2d" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <path d="M16 28 Q14 31 10 31" stroke="#2d4a2d" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M16 28 Q18 31 22 31" stroke="#2d4a2d" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Canopy - overlapping circles like the hero animation, suggesting forest mind -->
  <circle cx="16" cy="11" r="5" fill="#2d4a2d" opacity="0.9"/>
  <circle cx="12" cy="13" r="4" fill="#2d4a2d" opacity="0.7"/>
  <circle cx="20" cy="13" r="4" fill="#2d4a2d" opacity="0.7"/>
  <circle cx="14" cy="8" r="3.5" fill="#2d4a2d" opacity="0.6"/>
  <circle cx="18" cy="9" r="3" fill="#2d4a2d" opacity="0.5"/>
  <circle cx="16" cy="6" r="2.5" fill="#2d4a2d" opacity="0.4"/>
  
  <!-- Single amber accent dot - like a light in the canopy -->
  <circle cx="16" cy="11" r="1" fill="#c4883a" opacity="0.8"/>
</svg>
