<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- back-left tree -->
  <polygon points="6.2,21.8 9.2,13.8 12.2,21.8"
           fill="#2d7a2d" stroke="#000000" stroke-width="0.9" stroke-linejoin="round"/>
  <rect x="8.8" y="21.8" width="0.8" height="3.1" fill="#7a5a3a"/>

  <!-- back-right tree -->
  <polygon points="22.4,21.2 25.3,13.2 28.2,21.2"
           fill="#2d7a2d" stroke="#000000" stroke-width="0.9" stroke-linejoin="round"/>
  <rect x="24.9" y="21.2" width="0.8" height="3.2" fill="#7a5a3a"/>

  <!-- mid-left tree -->
  <polygon points="2.4,25.4 6.4,15.4 10.4,25.4"
           fill="#2d7a2d" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <rect x="5.8" y="25.4" width="1" height="3.6" fill="#7a5a3a"/>

  <!-- mid-right tree set slightly back -->
  <polygon points="19.4,23.7 23.6,12.7 27.8,23.7"
           fill="#2d7a2d" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>
  <rect x="23.0" y="23.7" width="1" height="3.5" fill="#7a5a3a"/>

  <!-- main foreground tree -->
  <polygon points="16,4.2 22.8,26.8 9.2,26.8"
           fill="#2d7a2d" stroke="#000000" stroke-width="1.1" stroke-linejoin="round"/>
  <rect x="14.9" y="26.8" width="2.2" height="4.2" fill="#7a5a3a"/>

  <!-- front-left small tree for forest effect -->
  <polygon points="9.8,27.0 12.4,20.2 15.0,27.0"
           fill="#2d7a2d" stroke="#000000" stroke-width="0.85" stroke-linejoin="round"/>
  <rect x="12.0" y="27.0" width="0.8" height="2.6" fill="#7a5a3a"/>
</svg>
